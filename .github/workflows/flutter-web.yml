name: Build and Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./medication_scheduler

      - name: Generate Hive adapters
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: ./medication_scheduler

      - name: Run tests
        run: flutter test
        working-directory: ./medication_scheduler

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/medication-scheduler/"
        working-directory: ./medication_scheduler

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./medication_scheduler/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4